name: Rust CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, Clippy, Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The ncn-program-core git dependency's repo pins a submodule by SSH
      # url (git@github.com:Unboxed-Software/commonware-avs-router-solana);
      # cargo cannot clone it on a clean runner without this https rewrite
      # (the repo is public — only the scheme is the problem).
      - name: Rewrite SSH github urls to https (cargo git deps)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check (all targets)
        run: cargo check --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The ncn-program-core git dependency's repo pins a submodule by SSH
      # url (git@github.com:Unboxed-Software/commonware-avs-router-solana);
      # cargo cannot clone it on a clean runner without this https rewrite
      # (the repo is public — only the scheme is the problem).
      - name: Rewrite SSH github urls to https (cargo git deps)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --lib --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The ncn-program-core git dependency's repo pins a submodule by SSH
      # url (git@github.com:Unboxed-Software/commonware-avs-router-solana);
      # cargo cannot clone it on a clean runner without this https rewrite
      # (the repo is public — only the scheme is the problem).
      - name: Rewrite SSH github urls to https (cargo git deps)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --lib --all-features