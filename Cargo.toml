[workspace]
members = [
    "bindings",
    "core",
    "eigenlayer",
    "examples/counter/bindings",
    "examples/counter/common",
    "examples/counter/node",
    "examples/counter/router",
    "examples/counter-solana/common",
    "examples/counter-solana/deployer",
    "examples/counter-solana/node",
    "examples/counter-solana/router",
    "jito",
    "node",
    "router",
    "scripts",
]
default-members = ["bindings", "core", "eigenlayer", "node", "router"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alloy = "1.0"
alloy-network = "1.0"
alloy-primitives = "1.0"
alloy-provider = "1.0"
alloy-signer = "1.0"
alloy-signer-local = "1.0"
anyhow = "1.0"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
async-trait = "0.1"
axum = "0.7"
bytes = "1.10.1"
clap = "4.5.37"
commonware-actor = "2026.5.0"
commonware-codec = "2026.5.0"
commonware-consensus = "2026.5.0"
commonware-cryptography = "2026.5.0"
commonware-macros = "2026.5.0"
commonware-math = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-utils = "2026.5.0"
dotenv = "0.15.0"
eigen-client-avsregistry = "2.0.0"
eigen-common = "2.0.0"
eigen-crypto-bls = "2.0.0"
eigen-crypto-bn254 = "2.0.0"
eigen-logging = "0.1.3"
eigen-services-operatorsinfo = "2.0.0"
eigen-utils = "2.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
governor = "0.10.4"
hex = "0.4"
num = "0.4"
num-bigint = "0.4"
prost = "0.13.5"
prost-build = "0.13.5"
rand = "0.9.1"
rand_core = "0.6.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = "0.5"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5.4", features = ["serde"] }

# --- Jito/Solana backend (additive; used only by the `jito` crate and
# `examples/counter-solana`) ---
# The NCN program's core crate: signature domain (MessageDigest,
# Sha256Normalized, certificate gamma) + on-chain account layouts. Its own
# workspace pins solana-program to the jito-solana fork below, so the solana
# runtime crates here use the SAME git source to keep types unified.
ncn-program-core = { git = "https://github.com/BreadchainCoop/jito-ncn-program", branch = "main" }
# NOTE: branch v2.1-upgrade was DELETED upstream; its head 358fbc3c remains
# fetchable by SHA, so these deps are pinned by `rev` (mirrors jito-ncn-program
# main's own re-pin). This removes the fresh-clone dependency on the dead
# branch ref that the previous `branch = "v2.1-upgrade"` + seeded-Cargo.lock
# arrangement carried. The sdk/core crates are the programs' own instruction
# builders + PDA derivations, used by the counter-solana deployer.
jito-bytemuck = { git = "https://github.com/jito-foundation/restaking", rev = "358fbc3c20d947c977a136808f9fbf7f070e478b" }
jito-restaking-core = { git = "https://github.com/jito-foundation/restaking", rev = "358fbc3c20d947c977a136808f9fbf7f070e478b" }
jito-restaking-sdk = { git = "https://github.com/jito-foundation/restaking", rev = "358fbc3c20d947c977a136808f9fbf7f070e478b" }
jito-vault-core = { git = "https://github.com/jito-foundation/restaking", rev = "358fbc3c20d947c977a136808f9fbf7f070e478b" }
jito-vault-sdk = { git = "https://github.com/jito-foundation/restaking", rev = "358fbc3c20d947c977a136808f9fbf7f070e478b" }
spl-token = "6.0.0"
spl-associated-token-account = "6.0.0"
solana-account-decoder = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
solana-client = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
solana-program = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
solana-rpc-client-api = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
solana-sdk = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
solana-transaction-status-client-types = { git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
borsh10 = { package = "borsh", version = "0.10.3" }

# Mirror of BreadchainCoop/jito-ncn-program's [patch.crates-io] section: pins
# every crates.io solana-* requirement in the Jito dependency graph to the
# SAME jito-solana fork `ncn-program-core`'s workspace builds against, so one
# set of solana types flows through ncn-program-core, the jito-restaking
# crates, their spl transitive deps, and this repo's `jito` crate. Inert for
# the EVM path (no pre-existing crate depends on any solana crate; unused
# entries only produce warnings).
[patch.crates-io]
solana-account = { package = "solana-account", git = "https://github.com/jito-foundation/jito-solana.git", rev = "87dcd086af931d81a0a71ad49cbea38e9655f166" }
