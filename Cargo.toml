[workspace]
members = [
    "bindings",
    "core",
    "eigenlayer",
    "examples/counter/bindings",
    "examples/counter/common",
    "examples/counter/node",
    "examples/counter/router",
    "node",
    "router",
    "scripts",
]
default-members = ["bindings", "core", "eigenlayer", "node", "router"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
alloy = "1.0"
alloy-network = "1.0"
alloy-primitives = "1.0"
alloy-provider = "1.0"
alloy-signer = "1.0"
alloy-signer-local = "1.0"
anyhow = "1.0"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
async-trait = "0.1"
axum = "0.7"
bytes = "1.10.1"
clap = "4.5.37"
commonware-actor = "2026.5.0"
commonware-codec = "2026.5.0"
commonware-consensus = "2026.5.0"
commonware-cryptography = "2026.5.0"
commonware-macros = "2026.5.0"
commonware-math = "2026.5.0"
commonware-p2p = "2026.5.0"
commonware-parallel = "2026.5.0"
commonware-runtime = "2026.5.0"
commonware-utils = "2026.5.0"
dotenv = "0.15.0"
eigen-client-avsregistry = "2.0.0"
eigen-common = "2.0.0"
eigen-crypto-bls = "2.0.0"
eigen-crypto-bn254 = "2.0.0"
eigen-logging = "0.1.3"
eigen-services-operatorsinfo = "2.0.0"
eigen-utils = "2.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
governor = "0.10.4"
hex = "0.4"
num-bigint = "0.4"
prost = "0.13.5"
prost-build = "0.13.5"
rand = "0.9.1"
rand_core = "0.6.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = "0.5"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5.4", features = ["serde"] }
